name: 'Coolify'
description: 'Deploy to coolify'

inputs:
  token:
    description: 'Github token'
    required: true
  imageName:
    description: 'Docker image name'
    required: true
  dockerfilePath:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
  coolifyWebhook:
    description: 'Coolify webhook URL'
    required: true
  coolifySecret:
    description: 'Coolify auth token'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token  }}
    - id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/vuetifyjs/${{ inputs.imageName }}
    - uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.dockerfilePath }}
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    - name: Deploy to Coolify
      run: |
        RESPONSE=$(curl \
          --request GET '${{ inputs.coolifyWebhook }}' \
          --header 'Authorization: Bearer ${{ inputs.coolifySecret }}' \
        )
        echo "$RESPONSE" \
          | jq -e '.deployments[0].message | select(contains("deployment queued"))' \
          || { echo "$RESPONSE"; exit 1; }
      shell: bash
